apiVersion: apps/v1
kind: Deployment
metadata:
  name: glimmung
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: glimmung
  template:
    metadata:
      annotations:
        glimmung.io/service-account-client-id: {{ .Values.serviceAccountClientId | quote }}
        {{- if .Values.observability.scrapeAnnotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        {{- end }}
      labels:
        app: glimmung
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      # 5 minutes covers a typical Helm install (with cert-manager +
      # ExternalSecret reconciliation) so an evicted pod can finish in-flight
      # test-slot work before exit. main.go's signal handler runs HTTP
      # drain + WaitForInflightTestSlots within this window. The pod gets
      # SIGTERM at t=0 and SIGKILL at t=300s; cleanly draining inside that
      # window is the difference between "pod replaced, slot lifecycle
      # uninterrupted" and "pod killed mid-Helm-install, next pod recovers."
      terminationGracePeriodSeconds: 300
      containers:
        - name: glimmung
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            # POSTGRES_HOST and POSTGRES_DATABASE come from the
            # glimmung-secrets K8s Secret materialized by ExternalSecret
            # (see envFrom below). POSTGRES_USER is a literal in
            # values.yaml because the UAMI name isn't a secret.
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: RUNNER_NAMESPACE
              value: {{ .Values.runner.namespace | quote }}
            - name: RUNNER_SERVICE_ACCOUNT
              value: {{ .Values.runner.serviceAccount | quote }}
            - name: RUNNER_IMAGE
              value: {{ .Values.runner.image | quote }}
            - name: RUNNER_ENTRYPOINT
              value: {{ .Values.runner.entrypoint | quote }}
            - name: RUNNER_CALLBACK_BASE_URL
              value: {{ .Values.runner.callbackBaseUrl | quote }}
            - name: RUNNER_JOB_TTL_SECONDS
              value: {{ .Values.runner.jobTtlSeconds | quote }}
            - name: RUNNER_NAMESPACE_ROLE
              value: {{ .Values.runner.namespaceRole | quote }}
            - name: RUNNER_STANDBY_DNS_NAMESPACE
              value: {{ .Values.runner.standbyDns.namespace | quote }}
            - name: RUNNER_STANDBY_DNS_GATEWAY_NAMESPACE
              value: {{ .Values.runner.standbyDns.gatewayNamespace | quote }}
            - name: RUNNER_STANDBY_DNS_GATEWAY_NAME
              value: {{ .Values.runner.standbyDns.gatewayName | quote }}
            - name: RUNNER_STANDBY_DNS_TARGET
              value: {{ .Values.runner.standbyDns.target | quote }}
            - name: RUNNER_STANDBY_DNS_DEFAULT_TTL
              value: {{ .Values.runner.standbyDns.defaultTtl | quote }}
            - name: PROVIDER_API_PROXY_NAMESPACE
              value: {{ .Values.providerApiProxy.namespace | quote }}
            - name: PROVIDER_API_PROXY_CA_SECRET
              value: {{ .Values.providerApiProxy.caSecretName | quote }}
            - name: PROVIDER_API_PROXY_CA_BUNDLE_PATH
              value: {{ .Values.providerApiProxy.caBundlePath | quote }}
            - name: PROVIDER_API_PROXY_CLAUDE_SERVICE
              value: {{ .Values.providerApiProxy.claude.serviceName | quote }}
            - name: PROVIDER_API_PROXY_CODEX_SERVICE
              value: {{ .Values.providerApiProxy.codex.serviceName | quote }}
            - name: PROVIDER_API_PROXY_GITHUB_SERVICE
              value: {{ .Values.providerApiProxy.github.serviceName | quote }}
            - name: RUNNER_PLAYWRIGHT_ENABLED
              value: {{ .Values.runner.playwright.enabled | quote }}
            - name: RUNNER_PLAYWRIGHT_IMAGE
              value: {{ .Values.runner.playwright.image | quote }}
            - name: RUNNER_PLAYWRIGHT_PORT
              value: {{ .Values.runner.playwright.port | quote }}
            - name: RUNNER_PLAYWRIGHT_CPU_REQUEST
              value: {{ .Values.runner.playwright.resources.requests.cpu | quote }}
            - name: RUNNER_PLAYWRIGHT_MEMORY_REQUEST
              value: {{ .Values.runner.playwright.resources.requests.memory | quote }}
            - name: RUNNER_PLAYWRIGHT_CPU_LIMIT
              value: {{ .Values.runner.playwright.resources.limits.cpu | quote }}
            - name: RUNNER_PLAYWRIGHT_MEMORY_LIMIT
              value: {{ .Values.runner.playwright.resources.limits.memory | quote }}
            - name: ARTIFACTS_STORAGE_ACCOUNT
              value: {{ .Values.artifacts.storageAccount | quote }}
            - name: ARTIFACTS_CONTAINER
              value: {{ .Values.artifacts.container | quote }}
            # Live-preview lane edge image (docs/live-preview-plan.md, Stage 4a).
            # Sourced from the fingerprint-pinned livePreview.image in values.yaml
            # (kept in lockstep by the live-preview-edge build workflow) so the
            # preview provision --sets a stable, built edge tag instead of a
            # floating `:edge`. Empty tag stays a provision ERROR (the provision
            # requires repo+tag), per the Stage 2a observable-failure design.
            - name: LIVE_PREVIEW_EDGE_IMAGE_REPOSITORY
              value: {{ .Values.livePreview.image.repository | quote }}
            - name: LIVE_PREVIEW_EDGE_IMAGE_TAG
              value: {{ .Values.livePreview.image.tag | quote }}
{{ if .Values.k8sSaAuth.enabled }}
            - name: K8S_SA_ALLOWLIST
              value: {{ .Values.k8sSaAuth.allowlist | quote }}
{{ end }}
            # Glimmung-owned auth.romaine.life slot origin reconciler. The
            # service uses the projected SA token below — its audience is
            # scoped to auth.romaine.life so a stolen token cannot be
            # replayed against any other in-cluster JWT validator. See
            # romaine-life/glimmung#142 stage 2. The same projected token
            # also drives the Tailscale OIDC federation flow used by the
            # remote-host execution primitives — auth.romaine.life
            # mints a custom-audience JWT, glimmung exchanges that JWT
            # at Tailscale's OAuth token endpoint, and the resulting
            # access token mints tailnet auth keys. No KV-resident
            # Tailscale OAuth secret. See docs/remote-host-execution.md.
            - name: AUTH_ROMAINE_LIFE_BASE_URL
              value: {{ .Values.authRomaineLife.baseUrl | quote }}
            - name: AUTH_ROMAINE_LIFE_TOKEN_PATH
              value: {{ printf "%s/token" .Values.authRomaineLife.tokenMountPath | quote }}
            - name: GLIMMUNG_TAILSCALE_OIDC_CLIENT_ID
              value: {{ .Values.remoteHost.tailscaleOidcClientId | quote }}
            - name: GLIMMUNG_TAILSCALE_TAILNET
              value: {{ .Values.remoteHost.tailscaleTailnet | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
            - secretRef:
                name: {{ .Values.externalSecret.secretName }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: auth-romaine-life-token
              mountPath: {{ .Values.authRomaineLife.tokenMountPath | quote }}
              readOnly: true
      volumes:
        # Per-audience projected SA token for the managed-origin reconciler.
        # auth.romaine.life validates the audience claim explicitly so this
        # token cannot be replayed against any other JWT validator.
        - name: auth-romaine-life-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.authRomaineLife.baseUrl | quote }}
                  expirationSeconds: 3600
                  path: token
