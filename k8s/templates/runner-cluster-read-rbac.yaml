apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glimmung-runner-cluster-read
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
  # The runner wrapper resolves the agent-egress Envoy Gateway
  # data-plane Service clusterIP (in envoy-gateway-system) so it can hostAlias
  # api.github.com onto it for the implementation agent. Read-only.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glimmung-runner-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glimmung-runner-cluster-read
subjects:
  - kind: ServiceAccount
    name: {{ .Values.runner.serviceAccount }}
    namespace: {{ .Values.runner.namespace }}
