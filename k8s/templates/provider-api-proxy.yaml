{{- if .Values.providerApiProxy.enabled }}
{{- $ns := .Values.providerApiProxy.namespace }}
{{- $sa := .Values.providerApiProxy.serviceAccount }}
{{- $caSecret := .Values.providerApiProxy.caSecretName }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: glimmung-provider-api-proxy-selfsigned
  namespace: {{ $ns }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: glimmung-provider-api-proxy-ca
  namespace: {{ $ns }}
spec:
  secretName: {{ $caSecret }}
  isCA: true
  commonName: glimmung-provider-api-proxy-ca
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: glimmung-provider-api-proxy-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: glimmung-provider-api-proxy-ca
  namespace: {{ $ns }}
spec:
  ca:
    secretName: {{ $caSecret }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: glimmung-provider-api-proxy
    azure.workload.identity/use: "true"
  {{- if .Values.providerApiProxy.serviceAccountClientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.providerApiProxy.serviceAccountClientId | quote }}
  {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.providerApiProxy.configSecret.name }}
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ .Values.providerApiProxy.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.providerApiProxy.credentials.storeName }}
    kind: {{ .Values.providerApiProxy.credentials.storeKind }}
  target:
    name: {{ .Values.providerApiProxy.configSecret.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AZURE_CLIENT_ID
      remoteRef:
        key: {{ .Values.providerApiProxy.configSecret.clientIdKvKey }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AZURE_TENANT_ID
      remoteRef:
        key: {{ .Values.providerApiProxy.configSecret.tenantIdKvKey }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
{{- range $provider, $cfg := dict "claude" .Values.providerApiProxy.claude "codex" .Values.providerApiProxy.codex }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cfg.secretName }}
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $.Values.providerApiProxy.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.providerApiProxy.credentials.storeName }}
    kind: {{ $.Values.providerApiProxy.credentials.storeKind }}
  target:
    name: {{ $cfg.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ $cfg.secretKey }}
      remoteRef:
        key: {{ $cfg.kvKey }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
{{- end }}
{{- range $provider, $cfg := dict "claude" .Values.providerApiProxy.claude "codex" .Values.providerApiProxy.codex }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $cfg.serviceName }}-leaf
  namespace: {{ $ns }}
spec:
  secretName: {{ $cfg.serviceName }}-leaf
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    {{- if eq $provider "claude" }}
    - api.anthropic.com
    {{- else }}
    - chatgpt.com
    {{- end }}
  issuerRef:
    name: glimmung-provider-api-proxy-ca
    kind: Issuer
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $cfg.serviceName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $cfg.serviceName }}
    app.kubernetes.io/component: provider-api-proxy
spec:
  selector:
    app.kubernetes.io/name: {{ $cfg.serviceName }}
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cfg.serviceName }}-envoy
  namespace: {{ $ns }}
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    static_resources:
      listeners:
        - name: api_listener
          address:
            socket_address: { address: 0.0.0.0, port_value: 8443 }
          per_connection_buffer_limit_bytes: 1048576
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: { filename: /etc/envoy/tls/tls.crt }
                        private_key: { filename: /etc/envoy/tls/tls.key }
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: provider_api_proxy
                    codec_type: AUTO
                    stream_idle_timeout: 600s
                    request_timeout: 600s
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            text_format_source:
                              inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(:PATH)% -> %RESPONSE_CODE% %RESPONSE_FLAGS% rx=%BYTES_RECEIVED% tx=%BYTES_SENT% dur_ms=%DURATION% req_id=%REQ(x-request-id)% retry=%REQ(x-envoy-attempt-count)%\n"
                    common_http_protocol_options:
                      idle_timeout: 600s
                    http_filters:
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ext_proc_local
                            timeout: 5s
                          failure_mode_allow: false
                          processing_mode:
                            request_header_mode: SEND
                            response_header_mode: SEND
                            request_body_mode: NONE
                            response_body_mode: NONE
                            request_trailer_mode: SKIP
                            response_trailer_mode: SKIP
                          message_timeout: 5s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      name: {{ $provider }}
                      virtual_hosts:
                        - name: {{ $provider }}
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route:
                                cluster: provider_api
                                timeout: 600s
                                retry_policy:
                                  retry_on: "retriable-status-codes"
                                  retriable_status_codes: [401]
                                  num_retries: 1
                                  per_try_timeout: 600s
                                auto_host_rewrite: true
      clusters:
        - name: provider_api
          type: LOGICAL_DNS
          connect_timeout: 5s
          dns_lookup_family: V4_ONLY
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: provider_api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          {{- if eq $provider "claude" }}
                          address: api.anthropic.com
                          {{- else }}
                          address: chatgpt.com
                          {{- end }}
                          port_value: 443
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              {{- if eq $provider "claude" }}
              sni: api.anthropic.com
              {{- else }}
              sni: chatgpt.com
              {{- end }}
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /etc/ssl/certs/ca-certificates.crt
        - name: ext_proc_local
          type: STATIC
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: ext_proc_local
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $cfg.serviceName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $cfg.serviceName }}
    app.kubernetes.io/component: provider-api-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $cfg.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $cfg.serviceName }}
        app.kubernetes.io/component: provider-api-proxy
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ $sa }}
      containers:
        - name: envoy
          image: {{ $.Values.providerApiProxy.envoyImage | quote }}
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--service-cluster"
            - {{ $cfg.serviceName | quote }}
          ports:
            - name: https
              containerPort: 8443
            - name: admin
              containerPort: 9901
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: leaf-tls
              mountPath: /etc/envoy/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
            periodSeconds: 10
        - name: ext-proc
          image: "{{ $.Values.providerApiProxy.image.repository }}:{{ $.Values.providerApiProxy.image.tag }}"
          imagePullPolicy: {{ $.Values.providerApiProxy.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 9000
            - name: metrics
              containerPort: 9100
          env:
            - name: PROXY_PROVIDER
              value: {{ $provider | quote }}
            - name: PROXY_PLACEHOLDER_BEARER
              value: {{ $.Values.providerApiProxy.placeholderBearer | quote }}
            - name: METRICS_PORT
              value: "9100"
            - name: AZURE_KEYVAULT_URL
              value: {{ $.Values.providerApiProxy.keyVaultUrl | quote }}
            - name: AZURE_FEDERATED_TOKEN_FILE
              value: /var/run/secrets/azure/tokens/azure-identity-token
            - name: AZURE_AUTHORITY_HOST
              value: https://login.microsoftonline.com/
            {{- if eq $provider "claude" }}
            - name: CLAUDE_CREDENTIALS_FILE
              value: {{ $cfg.credentialMountPath }}/{{ $cfg.secretKey }}
            - name: CLAUDE_CREDENTIALS_KV_KEY
              value: {{ $cfg.kvKey | quote }}
            {{- else }}
            - name: CODEX_CREDENTIALS_FILE
              value: {{ $cfg.credentialMountPath }}/{{ $cfg.secretKey }}
            - name: CODEX_CREDENTIALS_KV_KEY
              value: {{ $cfg.kvKey | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $.Values.providerApiProxy.configSecret.name }}
          volumeMounts:
            - name: provider-credentials
              mountPath: {{ $cfg.credentialMountPath }}
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: {{ $cfg.serviceName }}-envoy
        - name: leaf-tls
          secret:
            secretName: {{ $cfg.serviceName }}-leaf
        - name: provider-credentials
          secret:
            secretName: {{ $cfg.secretName }}
---
{{- end }}
{{- if .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: glimmung-provider-api-proxy
  namespace: {{ .Values.observability.serviceMonitor.namespace | default .Values.namespace }}
  {{- with .Values.observability.serviceMonitor.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $ns }}
  selector:
    matchLabels:
      app.kubernetes.io/component: provider-api-proxy
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
