{{- if eq (include "glimmung-issue.renderHot" .) "true" }}
{{- if not .Values.image.tag -}}
{{- fail "image.tag is required (the per-issue image tag built by az acr build)" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glimmung-issue.resourceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: glimmung-issue
    app.kubernetes.io/instance: {{ include "glimmung-issue.resourceName" . }}
    {{- if .Values.prNumber }}
    glimmung.io/pr: {{ .Values.prNumber | quote }}
    {{- end }}
spec:
  # Single serving pod. The live-preview-edge.replicas helper returns 1 and
  # FAILS the render on requested>1 when livePreview is enabled (a per-pod
  # emptyDir override behind replicas>1 flickers the co-watched frontend, v1
  # #1419); echoes the requested count otherwise.
  replicas: {{ include "live-preview-edge.replicas" (dict "spec" .Values.livePreview "requested" 1) }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ include "glimmung-issue.resourceName" . }}
  template:
    metadata:
      {{- if .Values.observability.scrapeAnnotations.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      {{- end }}
      labels:
        app.kubernetes.io/name: glimmung-issue
        app.kubernetes.io/instance: {{ include "glimmung-issue.resourceName" . }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      {{- if and (eq (include "glimmung-issue.isTestEnv" .) "true") .Values.hotSwapBackend.enabled }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      containers:
        - name: glimmung
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and (eq (include "glimmung-issue.isTestEnv" .) "true") .Values.hotSwapBackend.enabled }}
          command:
            - /app/glimmung-supervisor
          {{- end }}
          ports:
            # When a live-preview edge fronts the backend, the edge owns the
            # "http" served port and the backend's own port is renamed to an
            # internal name (glimmung-issue.appPortName) to avoid a duplicate
            # port name in the pod. The container port NUMBER (8000) is
            # unchanged, so the edge's loopback upstream still targets :8000.
            - name: {{ include "glimmung-issue.appPortName" . }}
              containerPort: 8000
          env:
            # POSTGRES_HOST and POSTGRES_DATABASE come from the Secret
            # materialized by ExternalSecret or shared with prod. POSTGRES_USER
            # is the workload-identity principal name, not a secret.
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            {{- if (eq (include "glimmung-issue.isTestEnv" .) "true") }}
            # Test slots share Postgres and the glimmung-runs namespace
            # with prod. Setting CONTROL_PLANE_LOOPS_ENABLED=false stops
            # the slot binary from starting the signal-drain, run-queue,
            # dispatch-timeout, and test-slot recovery reconcilers, so a
            # hot-swap can exercise HTTP handlers without racing prod for
            # the same rows or Kubernetes Jobs. The gate is enforced in
            # cmd/glimmung-go/main.go via Settings.ControlPlaneLoopsEnabled.
            - name: CONTROL_PLANE_LOOPS_ENABLED
              value: "false"
            {{- end }}
            {{- if and (eq (include "glimmung-issue.isTestEnv" .) "true") .Values.hotSwapBackend.enabled }}
            - name: GLIMMUNG_SUPERVISOR_CHILD
              value: {{ .Values.hotSwapBackend.childCommand | quote }}
            - name: GLIMMUNG_SUPERVISOR_HOT_ARTIFACT
              value: {{ .Values.hotSwapBackend.target | quote }}
            - name: GLIMMUNG_SUPERVISOR_RESTART_ENABLED
              value: "true"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
            - secretRef:
                name: {{ .Values.secretName }}
          {{- if and (eq (include "glimmung-issue.isTestEnv" .) "true") .Values.hotSwapBackend.enabled }}
          volumeMounts:
            - name: hot-backend
              mountPath: {{ .Values.hotSwapBackend.mountPath | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ include "glimmung-issue.appPortName" . }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ include "glimmung-issue.appPortName" . }}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        {{- /*
        The live-preview edge, in front of the backend. Self-gates on
        livePreview.enabled (off by default → renders nothing), so this changes
        nothing on a normal/validation install. When enabled it becomes the
        pod's served port and reverse-proxies the backend on :8000.
        */ -}}
        {{- include "live-preview-edge.container" .Values.livePreview | nindent 8 }}
      {{- if or (and (eq (include "glimmung-issue.isTestEnv" .) "true") .Values.hotSwapBackend.enabled) .Values.livePreview.enabled }}
      volumes:
        {{- if and (eq (include "glimmung-issue.isTestEnv" .) "true") .Values.hotSwapBackend.enabled }}
        - name: hot-backend
          emptyDir: {}
        {{- end }}
        {{- include "live-preview-edge.volume" .Values.livePreview | nindent 8 }}
      {{- end }}
{{- end }}
