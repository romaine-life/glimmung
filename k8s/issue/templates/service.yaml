{{- if eq (include "glimmung-issue.renderHot" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "glimmung-issue.resourceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: glimmung-issue
    app.kubernetes.io/instance: {{ include "glimmung-issue.resourceName" . }}
    {{- if .Values.prNumber }}
    glimmung.io/pr: {{ .Values.prNumber | quote }}
    {{- end }}
spec:
  selector:
    app.kubernetes.io/instance: {{ include "glimmung-issue.resourceName" . }}
  ports:
    - name: http
      port: 80
      # Served port: the live-preview edge when livePreview is enabled (it fronts
      # the backend), the backend's own port otherwise. The helper keeps normal /
      # validation renders targeting "http" unchanged.
      targetPort: {{ include "live-preview-edge.servedPortName" (dict "spec" .Values.livePreview "appPortName" (include "glimmung-issue.appPortName" .)) }}
{{- end }}
